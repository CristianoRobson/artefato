<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Artefato | Catálogo Impressão 3D</title>

<!-- ========================================== -->
<!-- TAGS DE COMPARTILHAMENTO (WhatsApp / Redes) -->
<!-- ========================================== -->
<meta property="og:title" content="Artefato | Catálogo de Impressão 3D">
<meta property="og:description" content="Encontre o que você procura em impressão 3D. Se não tem, a gente faz!">
<!-- Substitua o link abaixo pelo endereço real e completo da sua imagem hospedada -->
<meta property="og:image" content="https://cristianorobson.github.io/artefato/imgs/img_princ_site.jpg">
<meta property="og:url" content="https://cristianorobson.github.io/artefato/">
<meta property="og:type" content="website">

<!-- Ícone da Aba do Navegador (Favicon SVG Integrado) -->
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><path d='M 50 20 L 90 40 L 50 60 L 10 40 Z' fill='%23e2edf5' stroke='%231769aa' stroke-width='2'/><path d='M 10 40 L 10 50 L 50 70 L 50 60 Z' fill='%23b8c3cc' stroke='%231769aa' stroke-width='2'/><path d='M 50 60 L 50 70 L 90 50 L 90 40 Z' fill='%23d3dbe2' stroke='%231769aa' stroke-width='2'/><path d='M 50 35 L 75 47.5 L 50 60 L 25 47.5 Z' fill='%2338bdf8' opacity='0.8'/></svg>">

<style>
:root{--bg:#f4f6f8;--ink:#17212b;--muted:#65717d;--accent:#1769aa;--card:#fff}
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--ink)}
header{background:#123b5d;color:#fff;padding:28px 5vw 24px}
header .wrap,main{max-width:1200px;margin:auto}

/* Logo pequena, proporcional e responsiva */
.logo-container{margin-bottom:12px;display:flex;align-items:center}
.logo-container svg{
  height:52px;
  width:auto;
  max-width:100%;
  display:block;
}

.brand{font-size:13px;letter-spacing:2px;text-transform:uppercase;opacity:.8}
h1{margin:8px 0;font-size:clamp(24px,4vw,42px)}
header p{margin:0;color:#e2edf5}
.toolbar{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin:24px 0}
input,select{font:inherit;padding:12px 14px;border:1px solid #d3dbe2;border-radius:10px;background:#fff}
input{flex:1;min-width:190px}
main{padding:0 5vw 45px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:22px}
.card{background:var(--card);border-radius:16px;overflow:hidden;box-shadow:0 5px 18px #142c4010;border:1px solid #e6ebef}
.gallery{position:relative;background:#dce4ea;padding:9px}
.gallery-img-wrapper{display:block;cursor:zoom-in}
.gallery img{display:block;width:100%;height:230px;object-fit:cover;border:5px solid white;border-radius:10px;background:#edf1f4}
.arrow{position:absolute;top:50%;transform:translateY(-50%);border:0;border-radius:50%;width:38px;height:38px;background:#ffffffed;color:#123b5d;font-size:25px;cursor:pointer;box-shadow:0 2px 8px #0002;z-index:2}
.arrow:hover{background:#fff}
.prev{left:17px}.next{right:17px}
.counter{position:absolute;bottom:18px;right:18px;background:#14212ccc;color:#fff;border-radius:20px;padding:5px 9px;font-size:12px;z-index:2}
.dots{display:flex;justify-content:center;gap:6px;margin:8px 0 0;position:relative;z-index:2}
.dot{height:7px;width:7px;border-radius:50%;background:#b8c3cc;border:0;padding:0;cursor:pointer}
.dot.active{background:#1769aa;width:18px;border-radius:8px}
.info{padding:16px 18px 19px}
.category{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--accent);font-weight:bold}
h2{font-size:20px;margin:7px 0}
.description{color:var(--muted);font-size:14px;line-height:1.5;min-height:42px}
.price{font-size:23px;font-weight:700;margin:14px 0}
.details{font-size:12px;color:var(--muted);margin-bottom:15px}
.contact{display:block;text-align:center;text-decoration:none;background:var(--accent);color:#fff;padding:12px;border-radius:9px;font-weight:bold}
.contact:hover{background:#0e527f}
footer{text-align:center;padding:20px;color:var(--muted);font-size:12px}
.empty{display:none;padding:25px;background:white;border-radius:12px;color:var(--muted)}

/* Estilos da Modal/Janela Flutuante de Imagem */
.modal{
  display:none;
  position:fixed;
  z-index:9999;
  left:0;
  top:0;
  width:100%;
  height:100%;
  background-color:rgba(0,0,0,0.85);
  backdrop-filter:blur(5px);
  align-items:center;
  justify-content:center;
  padding:20px;
}
.modal.active{display:flex}
.modal-content{
  max-width:90vw;
  max-height:85vh;
  object-fit:contain;
  border-radius:12px;
  box-shadow:0 10px 30px rgba(0,0,0,0.5);
  border:3px solid white;
}
.modal-close{
  position:absolute;
  top:20px;
  right:25px;
  color:#fff;
  font-size:35px;
  font-weight:bold;
  cursor:pointer;
  background:none;
  border:none;
  line-height:1;
  padding:5px 10px;
}
.modal-close:hover{color:#38bdf8}

@media(max-width:480px){
  header{padding:20px 16px}
  main{padding:0 14px 30px}
  .logo-container svg{height:42px}
  .gallery img{height:215px}
  .toolbar{margin:18px 0;flex-direction:column;align-items:stretch}
  input{width:100%}
}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="logo-container">
      <!-- Logo Vetorial SVG Integrada -->
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 100">
        <g transform="translate(10, 10) scale(0.8)">
          <path d="M 50 20 L 90 40 L 50 60 L 10 40 Z" fill="#e2edf5" stroke="#1769aa" stroke-width="2"/>
          <path d="M 10 40 L 10 50 L 50 70 L 50 60 Z" fill="#b8c3cc" stroke="#1769aa" stroke-width="2"/>
          <path d="M 50 60 L 50 70 L 90 50 L 90 40 Z" fill="#d3dbe2" stroke="#1769aa" stroke-width="2"/>
          <g transform="translate(0, -15)">
            <path d="M 50 35 L 75 47.5 L 50 60 L 25 47.5 Z" fill="#38bdf8" stroke="#ffffff" stroke-width="1.5" opacity="0.7"/>
            <path d="M 50 25 L 75 37.5 L 50 50 L 25 37.5 Z" fill="#38bdf8" stroke="#ffffff" stroke-width="1.5" opacity="0.8"/>
            <path d="M 50 15 L 75 27.5 L 50 40 L 25 27.5 Z" fill="none" stroke="#ffffff" stroke-width="2"/>
          </g>
          <g transform="translate(0, -15)">
            <path d="M 50 5 L 50 15" stroke="#f59e0b" stroke-width="3" stroke-linecap="round"/>
            <path d="M 40 0 L 60 0 L 55 10 L 45 10 Z" fill="#65717d" stroke="#17212b" stroke-width="1.5"/>
            <path d="M 45 10 L 55 10 L 50 15 Z" fill="#17212b"/>
          </g>
        </g>
        <g transform="translate(100, 42)">
          <text x="0" y="0" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="28" fill="#ffffff">
            ARTEFATO
          </text>
          <text x="0" y="22" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" letter-spacing="1.5" fill="#38bdf8" opacity="0.95">
            IMPRESSÃO 3D
          </text>
        </g>
      </svg>
    </div>
    <div class="brand">Artefato • Artigos em Impressão 3D</div>
    <h1>Encontre o que você procura</h1>
    <p>Se não tem a gente faz!</p>
  </div>
</header>
<main>
  <div class="toolbar">
    <input id="search" type="search" placeholder="Buscar anúncio..." aria-label="Buscar anúncio">
    <select id="category" aria-label="Filtrar categoria">
      <option value="">Todas as categorias</option>
    </select>
  </div>
  <section id="catalog" class="grid" aria-label="Anúncios"></section>
  <p id="empty" class="empty">Nenhum anúncio encontrado. Tente outra busca.</p>
</main>
<footer>© <span id="year"></span> Sua marca • Catálogo demonstrativo. Edite nomes, fotos, preços e contatos para publicar.</footer>

<!-- Modal Flutuante para a Imagem -->
<div id="imageModal" class="modal" aria-hidden="true">
  <button class="modal-close" id="modalClose" aria-label="Fechar">&times;</button>
  <img class="modal-content" id="modalImg" alt="Ampliação da Imagem">
</div>

<script>
const whatsappNumber = "5549988901231";

const listings = [
{
  title: "Cofre Super Mario",
  category: "Infantil",
  price: "R$ 29,90",
  description: "Prático para seu filho, sobrinho, afilhado guardar seus dinheiros e deixar tudo à mão.",
  details: "Disponível • Consulte cores e medidas",
  images: [
    "imgs/Cofre_Mario_1.jpeg",
    "imgs/Cofre_Mario_2.jpeg",
    "imgs/Cofre_Mario_3.jpeg"
  ]
},
{
  title: "Suporte para Garrafas Jack Daniels",
  category: "Utilidades",
  price: "R$ 599,90",
  description: "Suporte para sua garrafa Jack Daniels.",
  details: "Disponível • Consulte cores e medidas",
  images: [
    "imgs/Porta_Uisq_1.jpeg",
    "imgs/Porta_Uisq_2.jpeg"
  ]
},
{
  title: "Suporte para controle de PS5",
  category: "Play",
  price: "R$ 29,90",
  description: "Suporte para seu controle de PS5.",
  details: "Disponível • Consulte cores e medidas",
  images: [
    "imgs/Suporte_Play_1.jpeg",
    "imgs/Suporte_Play_2.jpeg",
    "imgs/Suporte_Play_3.jpeg",
    "imgs/Suporte_Play_4.jpeg"
  ]
},
{
  title: "Lembrança Nascimento",
  category: "Infantil",
  price: "R$ 24,50",
  description: "Lembrança de Nascimento, com nome, peso, medidas e o que quiser.",
  details: "Disponível • Consulte cores e medidas",
  images: [
    "imgs/Lembranca_nasc_1.jpeg",
    "imgs/Lembranca_nasc_2.jpeg"
  ]
},
{
  title: "Enfeites de Natal personalizados",
  category: "Enfeites Natal",
  price: "R$ verificar",
  description: "Enfeites de Natal personalizados para sua árvore ou ambiente.",
  details: "Disponível • Consulte cores e medidas",
  images: [
    "imgs/Enfeite_trelica_1.jpeg",
    "imgs/Enfeite_trelica_3.jpeg"
  ]
},
{
  title: "Chaveiros personalizados",
  category: "Utilidades",
  price: "R$ verificar",
  description: "Chaveiros personalizados, com nome, abridor de garrafas e muito mais.",
  details: "Disponível • Consulte cores e medidas",
  images: [
    "imgs/Chaveiro_nome_1.jpeg",
    "imgs/Chaveiro_nome_2.jpeg"
  ]
}
];

// Preenche opções de categorias dinamicamente
function initCategories() {
  const select = document.getElementById('category');
  const categories = [...new Set(listings.map(item => item.category))];
  categories.sort().forEach(cat => {
    const opt = document.createElement('option');
    opt.value = cat;
    opt.textContent = cat;
    select.appendChild(opt);
  });
}

// Funções da Janela Flutuante (Modal)
const modal = document.getElementById('imageModal');
const modalImg = document.getElementById('modalImg');
const modalClose = document.getElementById('modalClose');

function openModal(src, alt) {
  modalImg.src = src;
  modalImg.alt = alt;
  modal.classList.add('active');
  modal.setAttribute('aria-hidden', 'false');
}

function closeModal() {
  modal.classList.remove('active');
  modal.setAttribute('aria-hidden', 'true');
}

modalClose.addEventListener('click', closeModal);
modal.addEventListener('click', (e) => {
  if (e.target === modal) closeModal();
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && modal.classList.contains('active')) closeModal();
});

const catalog = document.getElementById('catalog');

function render(){
  const q = document.getElementById('search').value.toLocaleLowerCase('pt-BR').trim();
  const cat = document.getElementById('category').value;
  
  const found = listings.filter(p => {
    const matchesQuery = (p.title + ' ' + p.description + ' ' + p.category).toLocaleLowerCase('pt-BR').includes(q);
    const matchesCat = !cat || p.category === cat;
    return matchesQuery && matchesCat;
  });

  catalog.innerHTML = '';

  found.forEach((p) => {
    const message = encodeURIComponent(`Olá! Tenho interesse no anúncio: ${p.title} (${p.price})`);
    const waUrl = `https://wa.me/${whatsappNumber}?text=${message}`;

    const card = document.createElement('article');
    card.className = 'card';
    card.innerHTML = `<div class="gallery">
      <div class="gallery-img-wrapper" title="Clique para ampliar a imagem">
        <img src="${p.images[0]}" alt="${p.title} — foto 1" loading="lazy">
      </div>
      <button class="arrow prev" aria-label="Foto anterior">‹</button>
      <button class="arrow next" aria-label="Próxima foto">›</button>
      <span class="counter">1 / ${p.images.length}</span>
      <div class="dots">${p.images.map((_,i) => `<button class="dot ${i===0?'active':''}" aria-label="Ver foto ${i+1}"></button>`).join('')}</div>
    </div><div class="info">
      <div class="category">${p.category}</div>
      <h2>${p.title}</h2>
      <p class="description">${p.description}</p>
      <div class="price">${p.price}</div>
      <div class="details">${p.details}</div>
      <a class="contact" href="${waUrl}" target="_blank" rel="noopener">Tenho interesse</a>
    </div>`;

    let current = 0;
    const img = card.querySelector('img');
    const imgWrapper = card.querySelector('.gallery-img-wrapper');
    const counter = card.querySelector('.counter');
    const dots = [...card.querySelectorAll('.dot')];

    function show(n){
      current = (n + p.images.length) % p.images.length;
      img.src = p.images[current];
      img.alt = `${p.title} — foto ${current + 1}`;
      counter.textContent = `${current + 1} / ${p.images.length}`;
      dots.forEach((d, i) => d.classList.toggle('active', i === current));
    }

    imgWrapper.addEventListener('click', () => {
      openModal(p.images[current], `${p.title} — foto ${current + 1}`);
    });

    card.querySelector('.prev').addEventListener('click', (e) => { e.stopPropagation(); show(current - 1); });
    card.querySelector('.next').addEventListener('click', (e) => { e.stopPropagation(); show(current + 1); });
    dots.forEach((d, i) => d.addEventListener('click', (e) => { e.stopPropagation(); show(i); }));

    catalog.appendChild(card);
  });

  document.getElementById('empty').style.display = found.length ? 'none' : 'block';
}

document.getElementById('search').addEventListener('input', render);
document.getElementById('category').addEventListener('change', render);
document.getElementById('year').textContent = new Date().getFullYear();

initCategories();
render();
</script>
</body>
</html>
