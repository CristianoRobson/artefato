<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Artefato Impressão 3D | Catálogo</title>
<style>
:root{--bg:#f4f6f8;--ink:#17212b;--muted:#65717d;--accent:#1769aa;--card:#fff}
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--ink)}
header{background:#123b5d;color:#fff;padding:28px 5vw 24px}
header .wrap,main{max-width:1200px;margin:auto}
.logo-container{margin-bottom:15px;display:flex;align-items:center}
.logo-container img{max-height:70px;width:auto;display:block}
.brand{font-size:13px;letter-spacing:2px;text-transform:uppercase;opacity:.8}
h1{margin:8px 0;font-size:clamp(27px,4vw,42px)}
header p{margin:0;color:#e2edf5}
.toolbar{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin:24px 0}
input,select{font:inherit;padding:12px 14px;border:1px solid #d3dbe2;border-radius:10px;background:#fff}
input{flex:1;min-width:190px}
main{padding:0 5vw 45px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:22px}
.card{background:var(--card);border-radius:16px;overflow:hidden;box-shadow:0 5px 18px #142c4010;border:1px solid #e6ebef}
.gallery{position:relative;background:#dce4ea;padding:9px}
.gallery img{display:block;width:100%;height:230px;object-fit:cover;border:5px solid white;border-radius:10px;background:#edf1f4}
.arrow{position:absolute;top:50%;transform:translateY(-50%);border:0;border-radius:50%;width:38px;height:38px;background:#ffffffed;color:#123b5d;font-size:25px;cursor:pointer;box-shadow:0 2px 8px #0002}
.arrow:hover{background:#fff}
.prev{left:17px}.next{right:17px}
.counter{position:absolute;bottom:18px;right:18px;background:#14212ccc;color:#fff;border-radius:20px;padding:5px 9px;font-size:12px}
.dots{display:flex;justify-content:center;gap:6px;margin:8px 0 0}
.dot{height:7px;width:7px;border-radius:50%;background:#b8c3cc;border:0;padding:0;cursor:pointer}
.dot.active{background:#1769aa;width:18px;border-radius:8px}
.info{padding:16px 18px 19px}
.category{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--accent);font-weight:bold}
h2{font-size:20px;margin:7px 0}
.description{color:var(--muted);font-size:14px;line-height:1.5;min-height:42px}
.price{font-size:23px;font-weight:700;margin:14px 0}
.details{font-size:12px;color:var(--muted);margin-bottom:15px}
.contact{display:block;text-align:center;text-decoration:none;background:var(--accent);color:#fff;padding:12px;border-radius:9px;font-weight:bold}
.contact:hover{background:#0e527f}
footer{text-align:center;padding:20px;color:var(--muted);font-size:12px}
.empty{display:none;padding:25px;background:white;border-radius:12px;color:var(--muted)}
@media(max-width:480px){header{padding:23px 18px}main{padding:0 14px 30px}.gallery img{height:215px}.toolbar{margin:18px 0}}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="logo-container">
      <img src="imagens/Logo_artefato.jpg" alt="Artefato Impressão 3D">
    </div>
    <div class="brand">Artefato • Impressão 3D</div>
    <h1>Encontre o que você procura</h1>
    <p>Uma vitrine simples para apresentar seus anúncios com várias fotos.</p>
  </div>
</header>
<main>
  <div class="toolbar">
    <input id="search" type="search" placeholder="Buscar anúncio..." aria-label="Buscar anúncio">
    <select id="category" aria-label="Filtrar categoria">
      <option value="">Todas as categorias</option>
      <option>Casa e utilidades</option><option>Acessórios</option><option>Decoração</option>
    </select>
  </div>
  <section id="catalog" class="grid" aria-label="Anúncios"></section>
  <p id="empty" class="empty">Nenhum anúncio encontrado. Tente outra busca.</p>
</main>
<footer>© <span id="year"></span> Artefato Impressão 3D • Catálogo online.</footer>
<script>
const listings = [
 {title:"Organizador multiuso",category:"Casa e utilidades",price:"R$ 39,90",description:"Prático para organizar pequenos objetos e deixar tudo à mão.",details:"Disponível • Consulte cores e medidas",images:[
  "https://images.unsplash.com/photo-1586023492125-27b2c045efd7?auto=format&fit=crop&w=900&q=85",
  "https://images.unsplash.com/photo-1600210492486-724fe5c67fb0?auto=format&fit=crop&w=900&q=85",
  "https://images.unsplash.com/photo-1616486338812-3dadae4b4ace?auto=format&fit=crop&w=900&q=85"]},
 {title:"Peça decorativa",category:"Decoração",price:"R$ 49,90",description:"Detalhe decorativo para dar personalidade ao seu ambiente.",details:"Peça de exemplo • Consulte disponibilidade",images:[
  "https://images.unsplash.com/photo-1490312278390-ab64016e0aa9?auto=format&fit=crop&w=900&q=85",
  "https://images.unsplash.com/photo-1494438639946-1ebd1d20bf85?auto=format&fit=crop&w=900&q=85",
  "https://images.unsplash.com/photo-1618221195710-dd6b41faaea6?auto=format&fit=crop&w=900&q=85"]},
 {title:"Acessório para o dia a dia",category:"Acessórios",price:"R$ 29,90",description:"Uma opção funcional para facilitar pequenas tarefas cotidianas.",details:"Produto ilustrativo • Consulte detalhes",images:[
  "https://images.unsplash.com/photo-1523275335684-37898b6baf30?auto=format&fit=crop&w=900&q=85",
  "https://images.unsplash.com/photo-1503602642458-232111445657?auto=format&fit=crop&w=900&q=85",
  "https://images.unsplash.com/photo-1491553895911-0055eca6402d?auto=format&fit=crop&w=900&q=85"]}
];
const catalog=document.getElementById('catalog');
function render(){
 const q=document.getElementById('search').value.toLocaleLowerCase('pt-BR');
 const cat=document.getElementById('category').value;
 const found=listings.filter(p=>(p.title+' '+p.description+' '+p.category).toLocaleLowerCase('pt-BR').includes(q)&&(!cat||p.category===cat));
 catalog.innerHTML='';
 found.forEach((p,index)=>{
  const card=document.createElement('article');card.className='card';
  card.innerHTML=`<div class="gallery">
   <img src="${p.images[0]}" alt="${p.title} — foto 1" loading="lazy">
   <button class="arrow prev" aria-label="Foto anterior">‹</button>
   <button class="arrow next" aria-label="Próxima foto">›</button>
   <span class="counter">1 / ${p.images.length}</span>
   <div class="dots">${p.images.map((_,i)=>`<button class="dot ${i===0?'active':''}" aria-label="Ver foto ${i+1}"></button>`).join('')}</div>
  </div><div class="info">
   <div class="category">${p.category}</div><h2>${p.title}</h2>
   <p class="description">${p.description}</p><div class="price">${p.price}</div>
   <div class="details">${p.details}</div>
   <a class="contact" href="https://wa.me/?text=${encodeURIComponent('Olá! Tenho interesse no anúncio: '+p.title)}" target="_blank" rel="noopener">Tenho interesse</a>
  </div>`;
  let current=0;const img=card.querySelector('img'),counter=card.querySelector('.counter'),dots=[...card.querySelectorAll('.dot')];
  function show(n){current=(n+p.images.length)%p.images.length;img.src=p.images[current];img.alt=`${p.title} — foto ${current+1}`;counter.textContent=`${current+1} / ${p.images.length}`;dots.forEach((d,i)=>d.classList.toggle('active',i===current))}
  card.querySelector('.prev').addEventListener('click',()=>show(current-1));
  card.querySelector('.next').addEventListener('click',()=>show(current+1));
  dots.forEach((d,i)=>d.addEventListener('click',()=>show(i)));
  catalog.appendChild(card);
 });
 document.getElementById('empty').style.display=found.length?'none':'block';
}
document.getElementById('search').addEventListener('input',render);
document.getElementById('category').addEventListener('change',render);
document.getElementById('year').textContent=new Date().getFullYear();
render();
</script>
</body>
</html>
